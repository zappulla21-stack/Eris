[build]
  publish = "public"

[[redirects]]
  from = "/eris"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/anteprima"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*.glb"
  [headers.values]
    Content-Type = "model/gltf-binary"

[[headers]]
  for = "/assets/eris-hologram.glb"
  [headers.values]
    Content-Disposition = 'attachment; filename="Eris.glb"'

[[headers]]
  for = "/assets/eris-hologram.fbx"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = 'attachment; filename="Eris.fbx"'
